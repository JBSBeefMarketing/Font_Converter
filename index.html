<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OTF to TTF Converter</title>
<style>
  /* JBS brand colors */
  :root { --navy: #232378; --brightblue: #41cdf5; --skyblue: #c3ebfa; --lime: #91d700; --grey: #e1e6f5;
          --muted: #5a5a8a; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         font-family: system-ui, "Segoe UI", sans-serif; background: var(--grey); color: var(--navy); }
  main { width: 100%; max-width: 600px; padding: 24px; text-align: center; }
  .logo { width: 220px; height: auto; margin-bottom: 20px; }
  h1 { margin: 0 0 6px; font-size: 2rem; }
  .sub { margin: 0 0 28px; color: var(--muted); }
  .card { background: #fff; border-radius: 16px; box-shadow: 0 2px 12px rgba(35,35,120,.10); min-height: 280px;
          display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 32px; }
  [hidden] { display: none !important; }

  /* Step 1: drop zone */
  #drop { cursor: pointer; border: 3px dashed #b9c0dc; transition: border-color .15s, background .15s; }
  #drop:hover, #drop.over { border-color: var(--brightblue); background: var(--skyblue); }
  .icon { width: 64px; height: 64px; margin-bottom: 16px; }
  .big { font-size: 1.5rem; font-weight: 600; margin: 0 0 8px; }
  .hint { color: var(--muted); margin: 0; }

  /* Step 2: progress */
  .bar { width: 100%; height: 22px; background: var(--grey); border-radius: 11px; overflow: hidden; margin: 20px 0 12px; }
  .fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--brightblue), var(--lime));
          border-radius: 11px; transition: width .2s; }
  #label { color: var(--muted); margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }

  /* Step 3: done */
  #download { display: inline-block; background: var(--navy); color: #fff; text-decoration: none;
              font-size: 1.5rem; font-weight: 600; padding: 22px 48px; border-radius: 14px; margin: 8px 0 20px;
              box-shadow: 0 4px 14px rgba(35,35,120,.35); transition: background .15s; }
  #download:hover { background: #2f2f9a; }
  .again { background: none; border: none; color: var(--muted); font-size: 1rem; text-decoration: underline; cursor: pointer; }
  .error { font-weight: 600; }

  footer { margin-top: 24px; font-size: .85rem; color: var(--muted); }
  footer a { color: var(--navy); }
</style>
</head>
<body>
<main>
  <img class="logo" src="jbs-logo.png" alt="JBS Beef USA">
  <h1>OTF &rarr; TTF Converter</h1>
  <p class="sub">Your fonts stay on your computer. Nothing is uploaded.</p>

  <label id="drop" class="card">
    <input id="file" type="file" accept=".otf" multiple hidden>
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#41cdf5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 10l5 5 5-5M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
    <p class="big">Drop your .otf font here</p>
    <p class="hint">or click to choose a file</p>
  </label>

  <section id="working" class="card" hidden>
    <p class="big">Converting&hellip;</p>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <p id="label"></p>
  </section>

  <section id="done" class="card" hidden>
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#91d700" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M7.5 12.5l3 3 6-6.5"/></svg>
    <a id="download" href="#">Download .ttf</a>
    <button class="again" type="button">Convert another</button>
  </section>

  <section id="failed" class="card" hidden>
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#232378" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0zM12 9v4M12 17h.01"/></svg>
    <p id="error" class="error"></p>
    <button class="again" type="button">Try again</button>
  </section>

  <footer>Converts OpenType/CFF fonts to TrueType using <a href="https://github.com/fonttools/fonttools">fontTools</a>.</footer>
</main>

<script>
const $ = id => document.getElementById(id);
const screens = ["drop", "working", "done", "failed"];
const show = name => screens.forEach(s => $(s).hidden = s !== name);

// Start loading the converter right away so it's usually ready before a file is dropped.
// Progress: first 30% = loading the converter, remaining 70% = converting.
const worker = new Worker("worker.js");
let engine = 0, pending = null;
const setProgress = (frac, label) => {
  $("fill").style.width = Math.round(100 * (0.3 * engine + 0.7 * frac)) + "%";
  if (label) $("label").textContent = label;
};

worker.onmessage = ({ data: m }) => {
  if (m.type === "loaded") {
    engine = m.stage;
    if (pending) setProgress(0, "Getting ready…");
    if (engine === 1 && pending) { worker.postMessage(pending.msg, pending.transfer); pending = null; }
  } else if (m.type === "progress") {
    setProgress(m.value, m.label);
  } else if (m.type === "done") {
    setProgress(1);
    const a = $("download");
    URL.revokeObjectURL(a.href);
    a.href = URL.createObjectURL(new Blob([m.bytes], { type: m.mime }));
    a.download = m.name;
    a.textContent = m.name.endsWith(".zip") ? "Download fonts (.zip)" : "Download .ttf";
    setTimeout(() => show("done"), 300);
  } else if (m.type === "error") {
    pending = null;
    $("error").textContent = m.message;
    show("failed");
  }
};

async function start(fileList) {
  const files = [...fileList].filter(f => /\.otf$/i.test(f.name));
  if (!files.length) {
    $("error").textContent = "Please choose a .otf font file.";
    return show("failed");
  }
  const payload = await Promise.all(files.map(async f => ({ name: f.name, data: new Uint8Array(await f.arrayBuffer()) })));
  const msg = { files: payload }, transfer = payload.map(p => p.data.buffer);
  show("working");
  setProgress(0, engine === 1 ? files[0].name : "Getting ready…");
  if (engine === 1) worker.postMessage(msg, transfer);
  else pending = { msg, transfer };
}

$("file").addEventListener("change", e => { start(e.target.files); e.target.value = ""; });
const drop = $("drop");
drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
drop.addEventListener("dragleave", () => drop.classList.remove("over"));
drop.addEventListener("drop", e => { e.preventDefault(); drop.classList.remove("over"); start(e.dataTransfer.files); });
document.querySelectorAll(".again").forEach(b => b.addEventListener("click", () => show("drop")));
// Dropping a file anywhere else on the page shouldn't navigate away.
addEventListener("dragover", e => e.preventDefault());
addEventListener("drop", e => e.preventDefault());
</script>
</body>
</html>
